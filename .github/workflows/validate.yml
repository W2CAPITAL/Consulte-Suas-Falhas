name: Verificar CRM jurídico
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramentas
        run: npm install --no-audit --no-fund
      - name: Testar sintaxe, login e acesso
        run: npm run check
